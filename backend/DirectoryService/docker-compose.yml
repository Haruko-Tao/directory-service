services:
    postgres:
        image: postgres
        container_name: directory_service_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
    seq:
        image: datalust/seq:latest
        container_name: directory_service_seq
        restart: unless-stopped
        environment:
            ACCEPT_EULA: "Y"
            SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
        ports:
            -   "5341:80"
        volumes:
            -   seq_data:/data
    
volumes:
    postgres_data:
    seq_data:
            
